<body>
  <h1>Variable in JS</h1>
  <ul>
    <li>
      var
    </li>
    <li>
      let
    </li>
    <li>
      const
    </li>
  </ul>
  <br>
  
  <div>
    <p>1. var - Global Scoped; Re-assign; Undefined; Accesss the value from anywhere.</p>
    <br>
    <p>2. let - Block Scoped; Re-assign; Undefined; Accesss the value from it's local.</p>
    <br>
    <p>3. const - Block Scoped; No Re-assign; Never Undefined; Accesss the value from it's local.</p>
    <br>
    
  </div>

</body>
